<!-- NextUrl - SEO Meta Tags Template -->
<!-- Copy và paste vào <head> của mỗi trang -->

<!-- Basic Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="author" content="Shydev">

<!-- Favicon Full Set -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#6C5CE7">

<!-- Open Graph Template (thay [TITLE], [DESCRIPTION], [URL]) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://nexturrl.vercel.app/[URL]">
<meta property="og:title" content="[TITLE] — NextUrl">
<meta property="og:description" content="[DESCRIPTION]">
<meta property="og:image" content="https://nexturrl.vercel.app/og-image.svg">
<meta property="og:site_name" content="NextUrl">
<meta property="og:locale" content="vi_VN">

<!-- Twitter Template -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="https://nexturrl.vercel.app/[URL]">
<meta property="twitter:title" content="[TITLE] — NextUrl">
<meta property="twitter:description" content="[DESCRIPTION]">
<meta property="twitter:image" content="https://nexturrl.vercel.app/og-image.svg">

<!-- Canonical URL Template -->
<link rel="canonical" href="https://nexturrl.vercel.app/[URL]">
